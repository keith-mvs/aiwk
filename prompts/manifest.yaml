schema_version: 1
corpus_id: reusable-software-engineering-prompts
entrypoint: INDEX.md
source_map: SOURCE_MAP.md
stage_vocabulary:
  - discover
  - inspect
  - analyze
  - plan
  - execute
  - validate
  - report
  - publish
authority_levels:
  read-only: No repository or remote mutation.
  bounded-mutation: Task-owned repository changes only; no Git staging, commit, or remote mutation.
  local-git-mutation: Explicitly bounded local Git mutation; no remote mutation.
  remote-mutation: Explicitly authorized mutation of a verified remote target.
routing:
  tie_break_order:
    - exact purpose match
    - narrowest scope
    - least authority
    - fewest stages
    - lexicographic id
  no_implicit_authority_escalation: true
prompts:
  - {id: repo.discover-context, path: repository/discover-context.prompt, category: repository, stage: discover, authority_level: read-only}
  - {id: repo.audit-structure, path: repository/audit-structure.prompt, category: repository, stage: inspect, authority_level: read-only}
